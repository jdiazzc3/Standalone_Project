<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cámara</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding camera-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Camara</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-button expand="block" (click)="takePicture()">Abrir Cámara</ion-button>

  <div *ngIf="image">
    <img [src]="image" alt="Foto tomada" />
  </div>
</ion-content>
