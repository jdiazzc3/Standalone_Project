<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">tab4</ion-title>
    </ion-toolbar>
  </ion-header>

  <div style="padding: 16px;">
    <h2>Ubicación actual</h2>
    <p *ngIf="latitude && longitude">Latitud: {{ latitude }}</p>
    <p *ngIf="latitude && longitude">Longitud: {{ longitude }}</p>
    <p *ngIf="!latitude || !longitude">Obteniendo ubicación...</p>
  </div>
</ion-content>
